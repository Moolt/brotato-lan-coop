name: Release

# Push a tag like v1.0.0 to publish a GitHub release with the mod zip attached.
# The tag must match "version_number" in the manifest.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          manifest_version=$(jq -r .version_number mods-unpacked/Moolt-Lan_Coop/manifest.json)
          if [ "v${manifest_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest version_number ${manifest_version}"
            exit 1
          fi

      - name: Build zip
        run: ./build.sh

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/Moolt-Lan_Coop.zip \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
