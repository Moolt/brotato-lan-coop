name: Build

# Builds the mod zip on every push to master and on pull requests.
# Download it from the run's "Artifacts" section.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Moolt-Lan_Coop
          path: dist/Moolt-Lan_Coop.zip
